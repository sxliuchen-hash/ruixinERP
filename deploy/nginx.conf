# ============================================================
# ERP 财务系统 Nginx 配置
# ============================================================
# 域名：erp.iptt.top
# 前端：静态文件（/var/www/erp/frontend/dist）
# 后端：反向代理到 Node.js（localhost:3001）
# SSL：Let's Encrypt 证书
# ============================================================

# 所有 Nginx 自身生成的响应均不暴露版本号。
server_tokens off;

server {
    listen 80;
    server_name erp.iptt.top;
    # HTTP 站点关闭日志，避免误用 HTTP 访问 callback 时记录 ?code=。
    access_log off;

    # SSO callback 必须从一开始就使用 HTTPS。HTTP callback 直接拒绝，不能把
    # 查询串中的一次性 Code/state 再复制到 HTTPS Location 响应头。
    location = /sso/callback {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 400 '{"success":false,"code":"HTTPS_REQUIRED","message":"SSO callback 必须使用 HTTPS"}';
    }

    # 其他普通 HTTP 请求仍跳转到 HTTPS。
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name erp.iptt.top;

    # ===== SSL 证书 =====
    ssl_certificate     /etc/letsencrypt/live/erp.iptt.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.iptt.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ===== 安全头 =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;

    # ===== 前端静态文件 =====
    root /var/www/erp/frontend/dist;
    index index.html;

    # SSO 回调必须直接命中 SPA index.html。查询参数中的一次性 Code
    # 不得被浏览器/代理缓存，也不得通过 Referer 发送给后续资源请求。
    location = /sso/callback {
        try_files $uri $uri/ /index.html;

        # 默认 combined access log 会记录完整查询串；关闭该 location 的访问日志，
        # 避免一次性 Code 出现在 Nginx 日志中。
        access_log off;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA history fallback：刷新或直接打开任意前端路由都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（Vite 构建产物带 hash，可长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ===== 后端 API 反向代理 =====
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # 只拦截 Nginx/upstream 连接失败类 502/504；后端主动返回的业务 503
        # 必须保留原始 JSON 和明确错误码（例如权限依赖服务暂不可用）。
        proxy_intercept_errors on;
        error_page 502 504 = @api_upstream_unavailable;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 上传文件大小限制（对账/导入 Excel）
        client_max_body_size 20m;

        # 超时设置（导出大文件可能耗时）
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location @api_upstream_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"success":false,"code":"UPSTREAM_UNAVAILABLE","message":"服务暂时不可用，请稍后重试"}';
    }

    # ===== 日志 =====
    access_log /var/log/nginx/erp_access.log;
    error_log  /var/log/nginx/erp_error.log;

    # ===== Gzip 压缩 =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
